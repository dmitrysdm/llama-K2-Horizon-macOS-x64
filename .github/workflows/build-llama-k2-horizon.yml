name: Build llama.cpp for macOS x64 with Metal (fully static, no OpenSSL)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-15-intel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: MBZUAI-IFM/llama.cpp
          ref: model/K2Horizon
          path: llama.cpp

      - name: Install dependencies
        run: |
          brew update
          brew install cmake

      - name: Get llama.cpp tag
        id: get_tag
        run: |
          cd llama.cpp
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "latest")
          echo "LLAMACPP_TAG=$TAG" >> $GITHUB_ENV

      - name: Build llama.cpp with Metal support (static, no SSL)
        run: |
          cd llama.cpp
          mkdir -p build && cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_METAL=ON \
            -DGGML_METAL_EMBED_LIBRARY=ON \
            -DBUILD_SHARED_LIBS=OFF \
            -DGGML_VULKAN=OFF \
            -DLLAMA_CURL=OFF \
            -DLLAMA_USE_OPENSSL=OFF \
            -DOPENSSL_ROOT_DIR="" \
            -DCMAKE_DISABLE_FIND_PACKAGE_OpenSSL=TRUE
          cmake --build . --config Release -j $(sysctl -n hw.ncpu)

      - name: Package artifacts (only executables, no libraries)
        run: |
          cd llama.cpp/build
          mkdir -p package
          find . -type f -perm +111 \
            -not -name "*.so" \
            -not -name "*.dylib" \
            -not -name "*.a" \
            -not -name "*.o" \
            -exec cp {} package/ \;
          cd package
          zip -r ../llama-${{ env.LLAMACPP_TAG }}-bin-macos-x64-metal.zip .
          cd ..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: llama-${{ env.LLAMACPP_TAG }}-bin-macos-x64-metal
          path: llama.cpp/build/llama-${{ env.LLAMACPP_TAG }}-bin-macos-x64-metal.zip
