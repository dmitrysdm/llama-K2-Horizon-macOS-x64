name: Build llama.cpp for macOS x64 with Vulkan (dynamic, minimal)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-15-intel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: MBZUAI-IFM/llama.cpp
          ref: model/K2Horizon
          path: llama.cpp

      - name: Install dependencies
        run: |
          brew update
          brew install cmake
          brew install vulkan-headers molten-vk shaderc

      - name: Get llama.cpp tag
        id: get_tag
        run: |
          cd llama.cpp
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "latest")
          echo "LLAMACPP_TAG=$TAG" >> $GITHUB_ENV

      - name: Build llama.cpp with Vulkan support (dynamic)
        run: |
          cd llama.cpp
          mkdir -p build && cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_VULKAN=ON \
            -DGGML_METAL=OFF \
            -DVulkan_INCLUDE_DIR=/usr/local/include \
            -DVulkan_LIBRARY=/usr/local/lib/libvulkan.dylib \
            -DMoltenVK_INCLUDE_DIR=/usr/local/include \
            -DMoltenVK_LIBRARY=/usr/local/lib/libMoltenVK.dylib
          cmake --build . --config Release -j $(sysctl -n hw.ncpu)

      - name: Package artifacts with RPATH fix
        run: |
          cd llama.cpp/build
          mkdir -p package
          # Копируем все файлы из build/bin (исполняемые и .dylib)
          cp -r bin/* package/ 2>/dev/null || true
          # Копируем libMoltenVK.dylib на всякий случай (уже есть в bin)
          cp /usr/local/lib/libMoltenVK.dylib package/ || true
          # Для каждого исполняемого файла меняем rpath на @executable_path
          for exe in package/llama-* package/test-*; do
            if [[ -f "$exe" && -x "$exe" ]]; then
              install_name_tool -change @rpath/libMoltenVK.dylib @executable_path/libMoltenVK.dylib "$exe" 2>/dev/null || true
              # Также можно поправить другие зависимости, например libggml-vulkan.dylib, если нужно
              # install_name_tool -change @rpath/libggml-vulkan.dylib @executable_path/libggml-vulkan.dylib "$exe" 2>/dev/null || true
            fi
          done
          cd package
          zip -r ../llama-${{ env.LLAMACPP_TAG }}-bin-macos-x64-vulkan.zip .
          cd ..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: llama-${{ env.LLAMACPP_TAG }}-bin-macos-x64-vulkan
          path: llama.cpp/build/llama-${{ env.LLAMACPP_TAG }}-bin-macos-x64-vulkan.zip
