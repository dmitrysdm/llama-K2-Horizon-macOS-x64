name: Build llama.cpp for macOS x64 with Vulkan

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-15-intel   # Intel‑based macOS 15 runner

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: dmitrysdm/llama-K2-Horizon-macOS-x64
          path: llama-K2-Horizon-macOS-x64

      - name: Install dependencies
        run: |
          brew update
          brew install cmake
          brew install vulkan-headers vulkan-loader molten-vk

      - name: Get llama.cpp tag
        id: get_tag
        run: |
          cd llama-K2-Horizon-macOS-x64
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "latest")
          echo "LLAMACPP_TAG=$TAG" >> $GITHUB_ENV

      - name: Build llama.cpp with Vulkan support
        run: |
          cd llama-K2-Horizon-macOS-x64
          mkdir -p build && cd build
          cmake .. \
            -DGGML_VULKAN=ON \
            -DGGML_METAL=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLAMA_ACCELERATE=ON
          cmake --build . --config Release -j $(sysctl -n hw.ncpu)

      - name: Package artifacts
        run: |
          cd llama-K2-Horizon-macOS-x64/build
          mkdir -p package
          # Копируем все исполняемые файлы (без библиотек и объектных)
          find . -type f -perm +111 \
            -not -name "*.so" \
            -not -name "*.dylib" \
            -not -name "*.a" \
            -not -name "*.o" \
            -exec cp {} package/ \;
          cd package
          zip -r ../llama-${{ env.LLAMACPP_TAG }}-bin-macos-x64-vulkan.zip .
          cd ..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: llama-${{ env.LLAMACPP_TAG }}-bin-macos-x64-vulkan
          path: llama-K2-Horizon-macOS-x64/build/llama-${{ env.LLAMACPP_TAG }}-bin-macos-x64-vulkan.zip
