name: Build llama.cpp K2-Horizon for macOS x64 Vulkan

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "0 3 * * 0"

permissions:
  contents: write

env:
  # K2-Horizon compatible llama.cpp
  LLAMACPP_REPOSITORY: MBZUAI-IFM/llama.cpp
  LLAMACPP_REF: model/K2Horizon

  # Used in artifact and release names
  LLAMACPP_TAG: k2-horizon

  # LunarG Vulkan SDK
  VULKAN_SDK_VERSION: 1.4.357.1

  BUILD_TYPE: Release

jobs:
  build:
    name: Build llama.cpp K2-Horizon - macOS x64 Vulkan
    runs-on: macos-15-intel

    steps:

      # ============================================================
      # Checkout
      # ============================================================

      - name: Checkout llama.cpp
        uses: actions/checkout@v6
        with:
          repository: ${{ env.LLAMACPP_REPOSITORY }}
          ref: ${{ env.LLAMACPP_REF }}
          fetch-depth: 1
          path: llama.cpp

      # ============================================================
      # Environment
      # ============================================================

      - name: Show build environment
        shell: bash
        run: |
          set -euxo pipefail

          echo "=== macOS ==="
          sw_vers

          echo
          echo "=== Kernel ==="
          uname -a

          echo
          echo "=== Architecture ==="
          uname -m

          echo
          echo "=== CPU ==="
          sysctl -n machdep.cpu.brand_string
          sysctl -n hw.ncpu

          echo
          echo "=== Compiler ==="
          clang --version

          echo
          echo "=== CMake ==="
          cmake --version

          echo
          echo "=== Ninja ==="
          ninja --version

          echo
          echo "=== Git ==="
          git --version

      # ============================================================
      # Install Vulkan SDK
      #
      # Do NOT run the macOS GUI installer.
      # Extract the SDK directly into RUNNER_TEMP.
      # ============================================================

      - name: Install Vulkan SDK
        shell: bash
        run: |
          set -euxo pipefail

          SDK_VERSION="${VULKAN_SDK_VERSION}"
          SDK_ROOT="${RUNNER_TEMP}/vulkan-sdk/${SDK_VERSION}"

          rm -rf "${RUNNER_TEMP}/vulkan-sdk"
          mkdir -p "${SDK_ROOT}"

          cd "${RUNNER_TEMP}"

          echo "Downloading Vulkan SDK ${SDK_VERSION}..."

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 5 \
            --connect-timeout 30 \
            --max-time 900 \
            -o vulkan_sdk.zip \
            "https://sdk.lunarg.com/sdk/download/${SDK_VERSION}/mac/vulkan_sdk.zip"

          echo
          echo "=== Downloaded archive ==="
          ls -lh vulkan_sdk.zip

          echo
          echo "=== Archive contents ==="
          unzip -l vulkan_sdk.zip | head -n 50

          echo
          echo "=== Extracting Vulkan SDK ==="

          unzip \
            -q \
            vulkan_sdk.zip \
            -d "${SDK_ROOT}"

          echo
          echo "=== Extracted files ==="
          find "${SDK_ROOT}" -maxdepth 4 -type f | head -n 100

          # --------------------------------------------------------
          # Locate actual SDK directory.
          #
          # Depending on SDK archive layout it may contain another
          # top-level directory.
          # --------------------------------------------------------

          ACTUAL_SDK=""

          if [ -d "${SDK_ROOT}/macOS" ]; then
            ACTUAL_SDK="${SDK_ROOT}/macOS"
          elif [ -d "${SDK_ROOT}/Contents" ]; then
            ACTUAL_SDK="${SDK_ROOT}"
          else
            CANDIDATE=$(find "${SDK_ROOT}" \
              -type f \
              -name "glslc" \
              -perm -111 \
              | head -n 1 || true)

            if [ -n "${CANDIDATE}" ]; then
              ACTUAL_SDK=$(dirname "$(dirname "${CANDIDATE}")")
            fi
          fi

          if [ -z "${ACTUAL_SDK}" ]; then
            echo "ERROR: Unable to locate Vulkan SDK after extraction."
            echo
            echo "SDK directory:"
            find "${SDK_ROOT}" -maxdepth 5 -print
            exit 1
          fi

          echo
          echo "Detected Vulkan SDK:"
          echo "${ACTUAL_SDK}"

          # --------------------------------------------------------
          # Export environment
          # --------------------------------------------------------

          echo "VULKAN_SDK=${ACTUAL_SDK}" >> "${GITHUB_ENV}"
          echo "${ACTUAL_SDK}/bin" >> "${GITHUB_PATH}"

          # Useful for CMake / pkg-config.
          echo "VK_LAYER_PATH=${ACTUAL_SDK}/share/vulkan/explicit_layer.d" >> "${GITHUB_ENV}"
          echo "DYLD_LIBRARY_PATH=${ACTUAL_SDK}/lib" >> "${GITHUB_ENV}"

          # Save for subsequent steps.
          echo "${ACTUAL_SDK}" > "${RUNNER_TEMP}/vulkan-sdk-path.txt"

      # ============================================================
      # Verify Vulkan SDK
      # ============================================================

      - name: Verify Vulkan SDK
        shell: bash
        run: |
          set -euxo pipefail

          echo "=== VULKAN_SDK ==="
          echo "${VULKAN_SDK}"

          if [ ! -d "${VULKAN_SDK}" ]; then
            echo "ERROR: VULKAN_SDK directory does not exist."
            exit 1
          fi

          echo
          echo "=== Vulkan SDK directory ==="
          ls -la "${VULKAN_SDK}"

          echo
          echo "=== glslc ==="

          if ! command -v glslc >/dev/null 2>&1; then
            echo "ERROR: glslc was not found in PATH."
            echo "PATH=${PATH}"
            exit 1
          fi

          glslc --version

          echo
          echo "=== Vulkan libraries ==="
          find "${VULKAN_SDK}/lib" \
            -maxdepth 2 \
            -type f \
            2>/dev/null \
            | sort \
            | head -n 100 || true

          echo
          echo "=== Vulkan headers ==="
          find "${VULKAN_SDK}/include" \
            -maxdepth 2 \
            -type f \
            2>/dev/null \
            | head -n 30 || true

      # ============================================================
      # Configure CMake
      # ============================================================

      - name: Configure llama.cpp
        shell: bash
        working-directory: llama.cpp
        run: |
          set -euxo pipefail

          echo "=== Git revision ==="
          git rev-parse HEAD

          echo
          echo "=== Git branch/ref ==="
          git branch --show-current || true

          echo
          echo "=== CMake configuration ==="

          cmake \
            -S . \
            -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE="${BUILD_TYPE}" \
            -DCMAKE_OSX_ARCHITECTURES=x86_64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DBUILD_SHARED_LIBS=OFF \
            -DGGML_NATIVE=OFF \
            -DGGML_VULKAN=ON \
            -DGGML_METAL=OFF \
            -DGGML_AVX=ON \
            -DGGML_AVX2=ON \
            -DGGML_FMA=ON \
            -DGGML_F16C=ON \
            -DGGML_BMI2=ON \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=ON \
            -DLLAMA_BUILD_SERVER=ON

      # ============================================================
      # Build
      # ============================================================

      - name: Build llama.cpp
        shell: bash
        working-directory: llama.cpp
        run: |
          set -euxo pipefail

          JOBS="$(sysctl -n hw.ncpu)"

          echo "Building with ${JOBS} parallel jobs..."

          cmake \
            --build build \
            --config "${BUILD_TYPE}" \
            --parallel "${JOBS}"

      # ============================================================
      # Locate binaries
      # ============================================================

      - name: Locate binaries
        shell: bash
        working-directory: llama.cpp
        run: |
          set -euxo pipefail

          echo "=== Executables ==="

          find build \
            -type f \
            -perm -111 \
            -print \
            | sort

          echo
          echo "=== llama-cli ==="

          LLAMA_CLI=$(find build \
            -type f \
            -name "llama-cli" \
            -perm -111 \
            | head -n 1 || true)

          if [ -z "${LLAMA_CLI}" ]; then
            echo "ERROR: llama-cli was not found."
            exit 1
          fi

          echo "${LLAMA_CLI}" > "${RUNNER_TEMP}/llama-cli-path.txt"

          echo
          echo "=== llama-server ==="

          LLAMA_SERVER=$(find build \
            -type f \
            -name "llama-server" \
            -perm -111 \
            | head -n 1 || true)

          if [ -z "${LLAMA_SERVER}" ]; then
            echo "ERROR: llama-server was not found."
            exit 1
          fi

          echo "${LLAMA_SERVER}" > "${RUNNER_TEMP}/llama-server-path.txt"

          echo
          echo "llama-cli: ${LLAMA_CLI}"
          echo "llama-server: ${LLAMA_SERVER}"

      # ============================================================
      # Verify x86_64
      # ============================================================

      - name: Verify x86_64 binaries
        shell: bash
        run: |
          set -euxo pipefail

          LLAMA_CLI="$(cat "${RUNNER_TEMP}/llama-cli-path.txt")"
          LLAMA_SERVER="$(cat "${RUNNER_TEMP}/llama-server-path.txt")"

          echo "=== llama-cli ==="
          file "${LLAMA_CLI}"
          lipo -info "${LLAMA_CLI}"

          echo
          echo "=== llama-server ==="
          file "${LLAMA_SERVER}"
          lipo -info "${LLAMA_SERVER}"

          file "${LLAMA_CLI}" | grep -q "x86_64"

          file "${LLAMA_SERVER}" | grep -q "x86_64"

      # ============================================================
      # Verify llama.cpp
      # ============================================================

      - name: Verify llama.cpp
        shell: bash
        run: |
          set -euxo pipefail

          LLAMA_CLI="$(cat "${RUNNER_TEMP}/llama-cli-path.txt")"
          LLAMA_SERVER="$(cat "${RUNNER_TEMP}/llama-server-path.txt")"

          echo "=== llama-cli version ==="
          "${LLAMA_CLI}" --version || true

          echo
          echo "=== llama-server version ==="
          "${LLAMA_SERVER}" --version || true

          echo
          echo "=== llama-cli help ==="
          "${LLAMA_CLI}" --help >/dev/null

          echo
          echo "=== llama-server help ==="
          "${LLAMA_SERVER}" --help >/dev/null

      # ============================================================
      # Verify Vulkan backend in compiled binary
      # ============================================================

      - name: Verify Vulkan backend
        shell: bash
        run: |
          set -euxo pipefail

          LLAMA_CLI="$(cat "${RUNNER_TEMP}/llama-cli-path.txt")"

          echo "=== Vulkan strings ==="

          strings "${LLAMA_CLI}" \
            | grep -i -E \
              "Vulkan|ggml_vulkan|VK_" \
            | head -n 100 \
            || true

          echo
          echo "=== Backend-related strings ==="

          strings "${LLAMA_CLI}" \
            | grep -i -E \
              "backend|vulkan|ggml" \
            | head -n 100 \
            || true

          echo
          echo "=== Vulkan libraries ==="

          otool -L "${LLAMA_CLI}" || true

          echo
          echo "Vulkan backend check completed."

      # ============================================================
      # Verify K2-Horizon support
      # ============================================================

      - name: Verify K2-Horizon support
        shell: bash
        working-directory: llama.cpp
        run: |
          set -euxo pipefail

          LLAMA_CLI="$(cat "${RUNNER_TEMP}/llama-cli-path.txt")"

          echo "=== K2-Horizon source references ==="

          grep -Rni \
            -E "K2Horizon|K2-Horizon|Horizon" \
            . \
            --exclude-dir=.git \
            --exclude-dir=build \
            | head -n 100 \
            || true

          echo
          echo "=== K2-Horizon binary strings ==="

          strings "${LLAMA_CLI}" \
            | grep -i \
              -E "K2Horizon|K2-Horizon|Horizon" \
            | head -n 100 \
            || true

          echo
          echo "K2-Horizon source/binary inspection completed."

      # ============================================================
      # Collect distribution
      # ============================================================

      - name: Prepare distribution
        shell: bash
        working-directory: llama.cpp
        run: |
          set -euxo pipefail

          DIST="${GITHUB_WORKSPACE}/dist"

          rm -rf "${DIST}"

          mkdir -p "${DIST}/bin"
          mkdir -p "${DIST}/docs"

          # --------------------------------------------------------
          # Required executables
          # --------------------------------------------------------

          LLAMA_CLI="$(cat "${RUNNER_TEMP}/llama-cli-path.txt")"
          LLAMA_SERVER="$(cat "${RUNNER_TEMP}/llama-server-path.txt")"

          cp "${LLAMA_CLI}" "${DIST}/bin/llama-cli"
          cp "${LLAMA_SERVER}" "${DIST}/bin/llama-server"

          # --------------------------------------------------------
          # Optional executables
          # --------------------------------------------------------

          for binary in \
            llama-bench \
            llama-perplexity \
            llama-quantize \
            llama-gguf \
            llama-tokenize
          do
            FOUND=$(find build \
              -type f \
              -name "${binary}" \
              -perm -111 \
              | head -n 1 || true)

            if [ -n "${FOUND}" ]; then
              cp "${FOUND}" "${DIST}/bin/${binary}"
            fi
          done

          # --------------------------------------------------------
          # Documentation
          # --------------------------------------------------------

          cp LICENSE "${DIST}/docs/" 2>/dev/null || true
          cp README.md "${DIST}/docs/" 2>/dev/null || true

          # --------------------------------------------------------
          # Build information
          # --------------------------------------------------------

          {
            echo "llama.cpp K2-Horizon macOS x64 Vulkan"
            echo
            echo "llama.cpp repository: ${LLAMACPP_REPOSITORY}"
            echo "llama.cpp ref:        ${LLAMACPP_REF}"
            echo "llama.cpp commit:     $(git rev-parse HEAD)"
            echo
            echo "Artifact tag:         ${LLAMACPP_TAG}"
            echo "Vulkan SDK:           ${VULKAN_SDK_VERSION}"
            echo
            echo "Target OS:            macOS"
            echo "Target architecture:  x86_64"
            echo "GPU backend:          Vulkan"
            echo "Metal backend:        OFF"
            echo "GGML_NATIVE:          OFF"
            echo
            echo "CPU features:"
            echo "  AVX"
            echo "  AVX2"
            echo "  FMA"
            echo "  F16C"
            echo "  BMI2"
            echo
            echo "Built on:"
            sw_vers
          } > "${DIST}/BUILD_INFO.txt"

          chmod +x "${DIST}/bin/"*

          echo
          echo "=== Distribution ==="

          find "${DIST}" \
            -maxdepth 3 \
            -type f \
            -print \
            | sort

          echo
          echo "=== Binary information ==="

          for binary in "${DIST}/bin/"*; do
            echo
            echo "--- ${binary} ---"
            file "${binary}"
            lipo -info "${binary}" || true
          done

      # ============================================================
      # Create ZIP
      # ============================================================

      - name: Create ZIP artifact
        shell: bash
        run: |
          set -euxo pipefail

          ARTIFACT="llama-${LLAMACPP_TAG}-bin-macos-x64-vulkan.zip"

          rm -f "${ARTIFACT}"

          cd dist

          zip \
            -r \
            -9 \
            "../${ARTIFACT}" \
            .

          cd ..

          echo
          echo "=== Artifact ==="
          ls -lh "${ARTIFACT}"

          unzip -l "${ARTIFACT}"

          echo "ARTIFACT=${ARTIFACT}" >> "${GITHUB_ENV}"

      # ============================================================
      # GitHub Actions artifact
      # ============================================================

      - name: Upload GitHub Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: llama-${{ env.LLAMACPP_TAG }}-bin-macos-x64-vulkan
          path: ${{ env.ARTIFACT }}
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # GitHub Release
      # ============================================================

      - name: Create GitHub Release
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.LLAMACPP_TAG }}
          name: llama.cpp ${{ env.LLAMACPP_TAG }} - macOS x64 Vulkan
          body: |
            # llama.cpp K2-Horizon — macOS x64 Vulkan

            K2-Horizon compatible llama.cpp build for Intel macOS.

            ## Target

            - Architecture: x86_64
            - GPU backend: Vulkan
            - Metal: disabled
            - CPU: AVX / AVX2 / FMA / F16C / BMI2
            - GGML_NATIVE: disabled

            ## K2-Horizon

            Repository:
            `${{ env.LLAMACPP_REPOSITORY }}`

            Branch:
            `${{ env.LLAMACPP_REF }}`

            ## Vulkan

            Vulkan SDK:
            `${{ env.VULKAN_SDK_VERSION }}`

            ## Artifact

            `llama-${{ env.LLAMACPP_TAG }}-bin-macos-x64-vulkan.zip`

          files: |
            ${{ env.ARTIFACT }}

          prerelease: true
          make_latest: false
