name: Build llama.cpp for macOS x64 with Vulkan (K2-Horizon Support)

on:
  workflow_dispatch: # Allows manual triggering from the GitHub Actions tab
  push:
    branches:
      - main # Triggers compilation on every push to the main branch

env:
  LLAMACPP_TAG: "K2Horizon-dev" # Set tag for the artifact filename structure

jobs:
  build:
    runs-on: macos-15-intel # Current runner for Intel-based (x64) macOS
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Clone MBZUAI-IFM llama.cpp fork (K2Horizon branch)
      run: |
        # Clone the custom model repository containing MoVA architecture support
        git clone --depth 1 --branch model/K2Horizon https://github.com llama_src

    - name: Install dependencies (Vulkan SDK & CMake)
      run: |
        brew update
        # Install build utilities and Vulkan SDK (MoltenVK) for macOS
        brew install cmake ninja vulkan-sdk

    - name: Set Vulkan Environment Variables
      run: |
        # Locate Vulkan SDK installed by Homebrew and export paths for CMake
        VULKAN_DIR=$(brew --prefix vulkan-sdk)
        echo "VULKAN_SDK=$VULKAN_DIR" >> $GITHUB_ENV
        echo "CMAKE_PREFIX_PATH=$VULKAN_DIR" >> $GITHUB_ENV
        echo "$VULKAN_DIR/bin" >> $GITHUB_PATH

    - name: Configure and Build with Vulkan
      run: |
        cd llama_src
        mkdir build
        cd build
        
        # Configure build: Enable Vulkan backend, explicitly disable Metal, and ensure examples are built
        cmake -B . -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DGGML_VULKAN=ON \
          -DGGML_METAL=OFF \
          -DLLAMA_BUILD_EXAMPLES=ON \
          -DCMAKE_PREFIX_PATH="${{ env.CMAKE_PREFIX_PATH }}" \
          ..
          
        # Run compilation
        cmake --build . --config Release

    - name: Prepare Artifacts
      run: |
        mkdir -p build_artifacts
        
        # Check and copy main binary handling both old and new llama.cpp naming styles
        if [ -f "llama_src/build/bin/llama-cli" ]; then
          cp llama_src/build/bin/llama-cli build_artifacts/
        elif [ -f "llama_src/build/bin/llama-main" ]; then
          cp llama_src/build/bin/llama-main build_artifacts/
        else
          cp llama_src/build/bin/llama build_artifacts/ 2>/dev/null || echo "Main binary not found"
        fi
        
        # Copy the quantization binary
        cp llama_src/build/bin/llama-quantize build_artifacts/ 2>/dev/null || cp llama_src/build/bin/quantize build_artifacts/ 2>/dev/null

    - name: Archive Binaries
      run: |
        # Compress the binaries using the requested tag naming format
        cd build_artifacts
        zip -r ../llama-${{ env.LLAMACPP_TAG }}-bin-macos-x64-vulkan.zip ./*

    - name: Upload Artifact
      uses: actions/upload-artifact@v4 # Fixed from incorrect actions/artifacts
      with:
        name: llama-${{ env.LLAMACPP_TAG }}-bin-macos-x64-vulkan
        path: llama-${{ env.LLAMACPP_TAG }}-bin-macos-x64-vulkan.zip
