name: Build llama.cpp for macOS x64 with Vulkan (dynamic)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-15-intel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: MBZUAI-IFM/llama.cpp
          ref: model/K2Horizon
          path: llama.cpp

      - name: Install dependencies
        run: |
          brew update
          brew install cmake
          brew install vulkan-headers vulkan-loader molten-vk shaderc spirv-headers

      - name: Get llama.cpp tag
        id: get_tag
        run: |
          cd llama.cpp
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "latest")
          echo "LLAMACPP_TAG=$TAG" >> $GITHUB_ENV

      - name: Build llama.cpp with Vulkan support (link directly to MoltenVK)
        run: |
          cd llama.cpp
          mkdir -p build && cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_VULKAN=ON \
            -DGGML_METAL=OFF \
            -DLLAMA_CURL=OFF \
            -DLLAMA_USE_OPENSSL=OFF \
            -DVulkan_LIBRARY=/usr/local/lib/libMoltenVK.dylib \
            -DVulkan_INCLUDE_DIR=/usr/local/include
          cmake --build . --config Release -j $(sysctl -n hw.ncpu)

      - name: Package artifacts with full dependency collection and RPATH fix
        run: |
          cd llama.cpp/build
          mkdir -p package
          # Copy all files from bin (executables and .dylib)
          cp -r bin/* package/ 2>/dev/null || true
          # Also copy libMoltenVK.dylib if not present
          cp /usr/local/lib/libMoltenVK.dylib package/ 2>/dev/null || true

          # Function to collect all non-system dependencies from a file
          collect_deps() {
            local file="$1"
            if [[ ! -f "$file" ]]; then return; fi
            otool -L "$file" 2>/dev/null | grep -E '/usr/local/opt|/usr/local/Cellar|/usr/local/lib' | awk '{print $1}' | while read dep; do
              # Resolve symlink to actual file
              if [[ -L "$dep" ]]; then
                dep=$(readlink -f "$dep")
              fi
              echo "$dep"
            done
          }

          # Collect dependencies from all files currently in package
          DEPS_FILE=$(mktemp)
          for f in package/*; do
            if [[ -f "$f" ]]; then
              collect_deps "$f" >> "$DEPS_FILE"
            fi
          done
          # Copy each unique dependency to package
          sort -u "$DEPS_FILE" | while read dep; do
            if [[ -f "$dep" ]]; then
              cp -L "$dep" package/ 2>/dev/null || true
            fi
          done
          rm -f "$DEPS_FILE"

          cd package

          # Fix all files: replace absolute paths and @rpath with @executable_path
          for file in *; do
            if [[ -f "$file" ]]; then
              # Find dependencies that start with @rpath, /usr/local/opt, /usr/local/Cellar, /usr/local/lib
              local deps=$(otool -L "$file" 2>/dev/null | grep -E '(@rpath|/usr/local/opt|/usr/local/Cellar|/usr/local/lib)' | awk '{print $1}')
              for dep in $deps; do
                local libname=$(basename "$dep")
                install_name_tool -change "$dep" "@executable_path/$libname" "$file" 2>/dev/null || true
              done
              # If it's a .dylib, set its ID to @executable_path/name
              if [[ "$file" == *.dylib ]]; then
                install_name_tool -id "@executable_path/$file" "$file" 2>/dev/null || true
              fi
            fi
          done

          # Zip the package
          zip -r ../llama-${{ env.LLAMACPP_TAG }}-bin-macos-x64-vulkan.zip .
          cd ..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: llama-${{ env.LLAMACPP_TAG }}-bin-macos-x64-vulkan
          path: llama.cpp/build/llama-${{ env.LLAMACPP_TAG }}-bin-macos-x64-vulkan.zip
