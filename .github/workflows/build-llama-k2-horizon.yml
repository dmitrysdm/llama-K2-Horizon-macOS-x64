name: Build llama.cpp for macOS x64 with Vulkan (dynamic)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-15-intel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: MBZUAI-IFM/llama.cpp
          ref: model/K2Horizon
          path: llama.cpp

      - name: Install dependencies
        run: |
          brew update
          brew install cmake
          brew install vulkan-headers vulkan-loader molten-vk shaderc spirv-headers

      - name: Get llama.cpp tag
        id: get_tag
        run: |
          cd llama.cpp
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "latest")
          echo "LLAMACPP_TAG=$TAG" >> $GITHUB_ENV

      - name: Build llama.cpp with Vulkan support (link directly to MoltenVK)
        run: |
          cd llama.cpp
          mkdir -p build && cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_VULKAN=ON \
            -DGGML_METAL=OFF \
            -DLLAMA_CURL=OFF \
            -DLLAMA_USE_OPENSSL=OFF \
            -DVulkan_LIBRARY=/usr/local/lib/libMoltenVK.dylib \
            -DVulkan_INCLUDE_DIR=/usr/local/include
          cmake --build . --config Release -j $(sysctl -n hw.ncpu)

      - name: Package artifacts
        run: |
          cd llama.cpp/build
          mkdir -p package
          # Copy all executables and libraries from bin
          cp -r bin/* package/ 2>/dev/null || true
          # Copy libMoltenVK.dylib (if not already in bin)
          cp /usr/local/lib/libMoltenVK.dylib package/ 2>/dev/null || true
          cd package

          # Fix libggml-vulkan.dylib to look for libMoltenVK.dylib in the same folder
          if [[ -f "libggml-vulkan.dylib" ]]; then
            install_name_tool -change /usr/local/lib/libMoltenVK.dylib @executable_path/libMoltenVK.dylib libggml-vulkan.dylib 2>/dev/null || true
          fi

          # Fix all executables to use local libMoltenVK.dylib
          for exe in llama-* test-*; do
            if [[ -f "$exe" && -x "$exe" ]]; then
              install_name_tool -change /usr/local/lib/libMoltenVK.dylib @executable_path/libMoltenVK.dylib "$exe" 2>/dev/null || true
              # Also fix any other @rpath dependencies if they exist
              otool -L "$exe" 2>/dev/null | grep -E '@rpath|/usr/local' | awk '{print $1}' | while read dep; do
                libname=$(basename "$dep")
                install_name_tool -change "$dep" "@executable_path/$libname" "$exe" 2>/dev/null || true
              done
            fi
          done

          # Fix any other .dylib files similarly (optional, but good)
          for lib in *.dylib; do
            if [[ -f "$lib" ]]; then
              install_name_tool -id "@executable_path/$lib" "$lib" 2>/dev/null || true
              otool -L "$lib" 2>/dev/null | grep -E '@rpath|/usr/local' | awk '{print $1}' | while read dep; do
                libname=$(basename "$dep")
                install_name_tool -change "$dep" "@executable_path/$libname" "$lib" 2>/dev/null || true
              done
            fi
          done

          # Zip the package
          zip -r ../llama-${{ env.LLAMACPP_TAG }}-bin-macos-x64-vulkan.zip .
          cd ..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: llama-${{ env.LLAMACPP_TAG }}-bin-macos-x64-vulkan
          path: llama.cpp/build/llama-${{ env.LLAMACPP_TAG }}-bin-macos-x64-vulkan.zip
