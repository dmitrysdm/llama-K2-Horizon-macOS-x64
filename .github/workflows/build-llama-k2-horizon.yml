name: Build llama.cpp for macOS x64 with Vulkan (dynamic)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-15-intel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: MBZUAI-IFM/llama.cpp
          ref: model/K2Horizon
          path: llama.cpp

      - name: Install dependencies
        run: |
          brew update
          brew install cmake
          brew install vulkan-headers vulkan-loader molten-vk shaderc spirv-headers

      - name: Get llama.cpp tag
        id: get_tag
        run: |
          cd llama.cpp
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "latest")
          echo "LLAMACPP_TAG=$TAG" >> $GITHUB_ENV

      - name: Build llama.cpp with Vulkan support
        run: |
          cd llama.cpp
          mkdir -p build && cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_VULKAN=ON \
            -DGGML_METAL=OFF
          cmake --build . --config Release -j $(sysctl -n hw.ncpu)

      - name: Package artifacts with full RPATH fix
        run: |
          cd llama.cpp/build
          mkdir -p package
          # Копируем все файлы из bin (исполняемые и .dylib)
          cp -r bin/* package/ 2>/dev/null || true
          # Копируем libMoltenVK.dylib (если его нет в bin)
          cp /usr/local/lib/libMoltenVK.dylib package/ 2>/dev/null || true
          cd package

          # Функция для исправления зависимостей в файле
          fix_deps() {
            local file="$1"
            if [[ ! -f "$file" ]]; then return; fi
            # Находим все зависимости с @rpath
            local deps=$(otool -L "$file" 2>/dev/null | grep '@rpath' | awk '{print $1}')
            for dep in $deps; do
              local libname=$(basename "$dep")
              # Заменяем @rpath/... на @executable_path/...
              install_name_tool -change "$dep" "@executable_path/$libname" "$file" 2>/dev/null || true
            done
          }

          # Исправляем все исполняемые файлы
          for exe in llama-* test-*; do
            if [[ -f "$exe" && -x "$exe" ]]; then
              fix_deps "$exe"
            fi
          done

          # Исправляем все .dylib (меняем ID и зависимости)
          for lib in *.dylib; do
            if [[ -f "$lib" ]]; then
              # Меняем ID библиотеки на @executable_path/имя
              install_name_tool -id "@executable_path/$lib" "$lib" 2>/dev/null || true
              # Исправляем внутренние зависимости
              fix_deps "$lib"
            fi
          done

          # Упаковываем
          zip -r ../llama-${{ env.LLAMACPP_TAG }}-bin-macos-x64-vulkan.zip .
          cd ..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: llama-${{ env.LLAMACPP_TAG }}-bin-macos-x64-vulkan
          path: llama.cpp/build/llama-${{ env.LLAMACPP_TAG }}-bin-macos-x64-vulkan.zip
