name: Build llama.cpp for macOS x64 with Vulkan (dynamic)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-15-intel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: MBZUAI-IFM/llama.cpp
          ref: model/K2Horizon
          path: llama.cpp

      - name: Install dependencies
        run: |
          brew update
          brew install cmake
          brew install vulkan-headers vulkan-loader molten-vk shaderc spirv-headers

      - name: Get llama.cpp tag
        id: get_tag
        run: |
          cd llama.cpp
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "latest")
          echo "LLAMACPP_TAG=$TAG" >> $GITHUB_ENV

      - name: Build llama.cpp with Vulkan support
        run: |
          cd llama.cpp
          mkdir -p build && cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_VULKAN=ON \
            -DGGML_METAL=OFF \
            -DLLAMA_CURL=OFF \
            -DLLAMA_USE_OPENSSL=OFF
          cmake --build . --config Release -j $(sysctl -n hw.ncpu)

      - name: Package artifacts with all dependencies automatically
        run: |
          cd llama.cpp/build
          mkdir -p package
          # Copy all files from bin (executables and .dylib)
          cp -r bin/* package/ 2>/dev/null || true

          # Function to collect all non-system dependencies from otool output
          collect_deps() {
            local file="$1"
            if [[ ! -f "$file" ]]; then return; fi
            # Find all dependencies that are not system paths (not starting with /usr/lib, /System, /usr/local/lib (but we want to copy some))
            # We will look for paths in /usr/local/opt, /usr/local/Cellar, and /usr/local/lib (but exclude system frameworks)
            otool -L "$file" 2>/dev/null | grep -E '/usr/local/opt|/usr/local/Cellar|/usr/local/lib' | awk '{print $1}' | while read dep; do
              # Resolve symlink to actual file
              if [[ -L "$dep" ]]; then
                dep=$(readlink -f "$dep")
              fi
              echo "$dep"
            done
          }

          # Collect all dependencies from executables and existing .dylib in package
          DEPS_FILE=$(mktemp)
          for f in package/*; do
            if [[ -f "$f" ]]; then
              collect_deps "$f" >> "$DEPS_FILE"
            fi
          done
          # Also check the original bin directory for libraries that might not be copied yet? But we already copied all from bin.

          # Copy each unique dependency to package
          sort -u "$DEPS_FILE" | while read dep; do
            if [[ -f "$dep" ]]; then
              cp -L "$dep" package/ 2>/dev/null || true
            fi
          done
          rm -f "$DEPS_FILE"

          cd package

          # Now fix all dependencies in all files (executables and libraries)
          fix_deps() {
            local file="$1"
            if [[ ! -f "$file" ]]; then return; fi
            # Find dependencies that start with @rpath or absolute paths in /usr/local
            local deps=$(otool -L "$file" 2>/dev/null | grep -E '(@rpath|/usr/local/opt|/usr/local/Cellar|/usr/local/lib)' | awk '{print $1}')
            for dep in $deps; do
              local libname=$(basename "$dep")
              # Change dependency to @executable_path/libname
              install_name_tool -change "$dep" "@executable_path/$libname" "$file" 2>/dev/null || true
            done
          }

          # Fix all executables
          for exe in llama-* test-*; do
            if [[ -f "$exe" && -x "$exe" ]]; then
              fix_deps "$exe"
            fi
          done

          # Fix all .dylib files (change ID and dependencies)
          for lib in *.dylib; do
            if [[ -f "$lib" ]]; then
              install_name_tool -id "@executable_path/$lib" "$lib" 2>/dev/null || true
              fix_deps "$lib"
            fi
          done

          # Zip the package
          zip -r ../llama-${{ env.LLAMACPP_TAG }}-bin-macos-x64-vulkan.zip .
          cd ..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: llama-${{ env.LLAMACPP_TAG }}-bin-macos-x64-vulkan
          path: llama.cpp/build/llama-${{ env.LLAMACPP_TAG }}-bin-macos-x64-vulkan.zip
