name: Build llama.cpp for macOS x64 with Vulkan (dynamic)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-15-intel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: MBZUAI-IFM/llama.cpp
          ref: model/K2Horizon
          path: llama.cpp

      - name: Install dependencies
        run: |
          brew update
          brew install cmake
          brew install vulkan-headers vulkan-loader molten-vk shaderc spirv-headers
          # openssl@3 is not needed because we disable it via CMake flags

      - name: Get llama.cpp tag
        id: get_tag
        run: |
          cd llama.cpp
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "latest")
          echo "LLAMACPP_TAG=$TAG" >> $GITHUB_ENV

      - name: Build llama.cpp with Vulkan support (link directly to MoltenVK)
        run: |
          cd llama.cpp
          mkdir -p build && cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_VULKAN=ON \
            -DGGML_METAL=OFF \
            -DLLAMA_CURL=OFF \
            -DLLAMA_USE_OPENSSL=OFF \
            -DVulkan_LIBRARY=/usr/local/lib/libMoltenVK.dylib \
            -DVulkan_INCLUDE_DIR=/usr/local/include
          cmake --build . --config Release -j $(sysctl -n hw.ncpu)

      - name: Package artifacts with all dependencies (including OpenSSL if present)
        run: |
          cd llama.cpp/build
          mkdir -p package
          # Copy all files from bin
          cp -r bin/* package/ 2>/dev/null || true
          # Copy libMoltenVK.dylib (if not already in bin)
          cp /usr/local/lib/libMoltenVK.dylib package/ 2>/dev/null || true
          # Copy OpenSSL libraries if they exist (just in case)
          if [[ -f /usr/local/opt/openssl@3/lib/libssl.3.dylib ]]; then
            cp /usr/local/opt/openssl@3/lib/libssl.3.dylib package/ 2>/dev/null || true
            cp /usr/local/opt/openssl@3/lib/libcrypto.3.dylib package/ 2>/dev/null || true
          fi
          cd package

          # Fix libggml-vulkan.dylib to use local libMoltenVK.dylib
          if [[ -f "libggml-vulkan.dylib" ]]; then
            install_name_tool -change /usr/local/lib/libMoltenVK.dylib @executable_path/libMoltenVK.dylib libggml-vulkan.dylib 2>/dev/null || true
          fi

          # Fix all executables and libraries: replace absolute paths with @executable_path
          for file in *; do
            if [[ -f "$file" ]]; then
              # For executables and .dylib
              otool -L "$file" 2>/dev/null | grep -E '@rpath|/usr/local/opt|/usr/local/lib' | awk '{print $1}' | while read dep; do
                libname=$(basename "$dep")
                install_name_tool -change "$dep" "@executable_path/$libname" "$file" 2>/dev/null || true
              done
              # For .dylib files, also set ID
              if [[ "$file" == *.dylib ]]; then
                install_name_tool -id "@executable_path/$file" "$file" 2>/dev/null || true
              fi
            fi
          done

          # Zip the package
          zip -r ../llama-${{ env.LLAMACPP_TAG }}-bin-macos-x64-vulkan.zip .
          cd ..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: llama-${{ env.LLAMACPP_TAG }}-bin-macos-x64-vulkan
          path: llama.cpp/build/llama-${{ env.LLAMACPP_TAG }}-bin-macos-x64-vulkan.zip
